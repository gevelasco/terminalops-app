@let isNew = layout() === "new";

<div
  class="operator-coverage-fields__row"
  [class.operator-coverage-fields__row--new]="isNew"
  [class.operator-coverage-fields__row--edit]="!isNew"
>
  <to-select
    label="Tipo de cobertura *"
    [placeholder]="isNew ? 'Selecciona' : ''"
    [options]="insuranceKindOptions()"
    [(value)]="insuranceKind"
  />
</div>

@if (insuranceKind() === "public") {
  <div
    class="operator-coverage-fields__row"
    [class.operator-coverage-fields__row--new]="isNew"
    [class.operator-coverage-fields__row--edit]="!isNew"
  >
    <to-input
      label="NSS"
      [placeholder]="isNew ? 'Número de seguridad social' : ''"
      [(value)]="pubNss"
    />
    <to-input
      [label]="
        isNew ? 'Fecha de alta IMSS (referencia)' : 'Fecha de alta IMSS'
      "
      type="date"
      [(value)]="pubImssAlta"
    />
    <to-input
      label="Cantidad diaria"
      type="text"
      [groupThousands]="true"
      [placeholder]="isNew ? 'Ej. 350' : ''"
      [(value)]="pubDailyAmount"
    />
    <to-select
      label="Tipo de salario"
      [placeholder]="isNew ? 'Selecciona' : ''"
      [options]="salaryTypeOptions"
      [(value)]="pubSalaryType"
    />
  </div>
  <to-textarea
    label="Notas"
    [placeholder]="isNew ? 'Opcional' : ''"
    [(value)]="pubNotes"
  />
}

@if (insuranceKind() === "private") {
  <div
    class="operator-coverage-fields__row"
    [class.operator-coverage-fields__row--new]="isNew"
    [class.operator-coverage-fields__row--edit]="!isNew"
  >
    <to-input
      label="Aseguradora"
      [placeholder]="isNew ? 'Ej. GNP, AXA…' : ''"
      [(value)]="privCarrier"
    />
    <to-input label="Número de póliza" [(value)]="privPolicy" />
  </div>
  <div
    class="operator-coverage-fields__row"
    [class.operator-coverage-fields__row--new]="isNew"
    [class.operator-coverage-fields__row--edit]="!isNew"
  >
    <to-input label="Vigencia desde" type="date" [(value)]="privValidFrom" />
    <to-input label="Vigencia hasta" type="date" [(value)]="privValidTo" />
  </div>
  <div
    class="operator-coverage-fields__row"
    [class.operator-coverage-fields__row--new]="isNew"
    [class.operator-coverage-fields__row--edit]="!isNew"
  >
    <to-input
      label="Prima (monto o descripción)"
      [placeholder]="isNew ? 'Ej. 980 MXN mensual' : ''"
      [(value)]="privPremium"
    />
    <to-select
      label="Periodo de prima"
      [options]="premiumPeriodOptions()"
      [(value)]="privPremiumPeriod"
    />
  </div>
  <to-input
    [label]="
      isNew ? 'Deducible / coaseguro (notas)' : 'Deducible / coaseguro'
    "
    [(value)]="privDeductible"
  />
  <to-textarea
    [label]="isNew ? 'Resumen de cobertura' : 'Resumen plan'"
    [placeholder]="isNew ? 'Plan, cobertura territorial…' : ''"
    [(value)]="privPlan"
  />
}
