<to-page-header
  title="Configuración"
  subtitle="Controles operativos, usuarios y ajustes de la empresa."
>
  @if (pageTab() === 'controles' && canViewControls()) {
    <to-button
      type="button"
      variant="primary"
      [loading]="controlsSaving()"
      [disabled]="controlsSaving()"
      (click)="saveControls()"
    >
      <to-icon name="save" [size]="18" />
      {{ controlsSaving() ? 'Guardando…' : 'Guardar configuración' }}
    </to-button>
  } @else if (pageTab() === 'users' && !usersTabLoading()) {
    <to-button type="button" variant="primary" (click)="openNewUser()">
      <span class="settings-page-header__btn-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path
            fill="currentColor"
            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4zm5 3v-2h-2v2h-2v2h2v2h2v-2h2v-2h-2z"
          />
        </svg>
      </span>
      Nuevo usuario
    </to-button>
  }
</to-page-header>

<div
  class="settings-table-block"
  [class.settings-table-block--controles]="pageTab() === 'controles'"
>
  <div class="settings-toolbar">
    <to-segment-control
      layout="toolbar"
      ariaLabel="Secciones de configuración"
      [tabs]="viewSegmentTabs()"
      [activeId]="pageTab()"
      (tabSelect)="onPageTabSelect($event)"
    />
  </div>

  @switch (pageTab()) {
    @case ('controles') {
      <app-settings-controls-tab />
    }
    @case ('users') {
      <app-users-settings-tab />
    }
  }
</div>
