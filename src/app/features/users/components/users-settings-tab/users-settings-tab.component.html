@if (newUserOpen()) {
  @defer {
    <app-users-new-drawer
      (dismiss)="newUserOpen.set(false)"
      (saved)="onUserCreated()"
    />
  }
}

@if (selectedUser(); as user) {
  @defer {
    <app-users-detail-drawer
      [user]="user"
      (dismiss)="onDetailDismiss()"
      (saved)="onUserSaved($event)"
    />
  }
}

@if (loading()) {
  <to-module-skeleton layout="overview-grid" [rows]="6" />
} @else if (loadError()) {
  <p class="users-settings-tab__error" role="alert">
    No se pudo cargar la lista de usuarios.
    <button type="button" class="users-settings-tab__retry" (click)="reloadUsers()">
      Reintentar
    </button>
  </p>
} @else {
  <app-users-overview [users]="userRows()" (cardSelect)="onUserCardSelect($event)" />
}
