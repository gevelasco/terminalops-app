<div
  class="destination-rate-location-fields__stack"
  [class.destination-rate-location-fields__stack--route-form]="routeFormLayout()"
>
  <div class="destination-rate-location-fields__cp-cell">
    <to-input
      label="CP destino"
      placeholder="Ej. 77560"
      [maxLength]="5"
      [digitsOnly]="true"
      inputName="destinationRatePostalCode"
      autocomplete="postal-code"
      suffixIcon="search"
      suffixIconAriaLabel="Buscar código postal"
      [(value)]="postalCode"
      [loading]="cpLoading()"
      [disabled]="disabled() || cpLoading()"
      (suffixIconClick)="onCpSearch()"
    />
  </div>
  @if (cpLoading()) {
    <div
      class="destination-rate-location-fields__loading"
      [class.destination-rate-location-fields__loading--route-form]="routeFormLayout()"
      role="status"
      aria-live="polite"
    >
      <span class="destination-rate-location-fields__spinner" aria-hidden="true"></span>
      <span class="destination-rate-location-fields__loading-text">Cargando…</span>
    </div>
  }
  <div class="destination-rate-location-fields__city-cell">
    <to-input
      label="Ciudad / municipio"
      placeholder="—"
      [disabled]="true"
      [displayValue]="cityLine()"
    />
  </div>
  <div class="destination-rate-location-fields__locality-cell">
    @if (cpEditing() && localityOptions().length > 0) {
      <to-select
        label="Localidad"
        placeholder="Elige localidad en la lista"
        [options]="localityOptions()"
        [value]="settlementConsId()"
        [disabled]="disabled()"
        (valueChange)="onLocalityChange($event)"
      />
    } @else if (localityLabel()) {
      <to-input
        label="Localidad"
        [disabled]="true"
        [displayValue]="localityLabel()"
      />
    } @else {
      <to-input label="Localidad" [disabled]="true" displayValue="—" />
    }
  </div>
</div>
